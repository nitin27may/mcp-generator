site_name: mcpgen
site_url: https://nitinksingh.com/mcp-generator/
site_description: >-
  Agent Readiness and Governance Layer for APIs — turn an OpenAPI or Swagger document into a
  governed, portable MCP tool surface that runs over stdio or Streamable HTTP.
site_author: Nitin Singh

repo_url: https://github.com/nitin27may/mcp-generator
repo_name: nitin27may/mcp-generator
edit_uri: edit/main/docs/

docs_dir: docs

# Two categories are kept out of the published site:
#   README.md          — index.md is the site landing page; both would collide. The README
#                        files stay so that browsing the folders on GitHub still renders.
#   BRD / TECHNICAL-PLAN / RISKS / research
#                      — internal engineering record: requirements, work breakdown, risk
#                        register. Useful in-repo, not part of the public documentation.
exclude_docs: |
  README.md
  BRD.md
  TECHNICAL-PLAN.md
  RISKS.md
  research/

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  icon:
    logo: material/api
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  # GitHub-compatible slugs: these pages are read on GitHub too, and GitHub renders an
  # em-dash heading as "a--b" where MkDocs' default gives "a-b". Without this, every
  # cross-link written against the GitHub rendering silently 404s on the site.
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Mermaid via Material's native custom fence — no extra plugin needed.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  # Drop the "Made with Material for MkDocs" footer line. Material's documented
  # opt-out; keeps the prev/next page navigation, which replacing the footer
  # partial outright would remove.
  generator: false
  analytics:
    provider: google
    # Same property as the sibling doc sites: the family is measured as one
    # property and segmented by path, not split across four properties.
    property: G-5Z8HS51RCP
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nitin27may/mcp-generator
      name: Source on GitHub

nav:
  - Home: index.md
  - Getting started:
      - CLI reference: CLI.md
  - Reference:
      - mcp.config.json: CONFIG.md
      - Authentication: OAUTH.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Architecture:
      - Overview: ARCHITECTURE.md
      - Design decisions: adr/index.md
      - ADR-0001 — Portable config is the source of truth: adr/0001-portable-config-is-source-of-truth.md
      - ADR-0002 — Data-driven runtime: adr/0002-data-driven-runtime.md
      - ADR-0003 — Parser types never escape the adapter: adr/0003-parser-types-never-escape-adapter.md
      - ADR-0004 — MCP protocol isolated behind an adapter: adr/0004-mcp-protocol-isolated-behind-adapter.md
      - ADR-0005 — Separate auth planes: adr/0005-separate-auth-planes.md
      - ADR-0006 — Secrets are references only: adr/0006-secrets-are-references-only.md
      - ADR-0007 — Deterministic readiness before AI: adr/0007-deterministic-readiness-before-ai.md
      - ADR-0008 — Destructive retry disabled by default: adr/0008-destructive-retry-disabled-by-default.md
      - ADR-0009 — MCP SDK v2 and the modern era: adr/0009-mcp-sdk-v2-and-modern-era.md
      - ADR-0010 — Token exchange, not passthrough: adr/0010-token-exchange-not-passthrough.md
  - Contributing: CONTRIBUTING.md
