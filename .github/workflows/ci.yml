name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reproducible installs; fail rather than silently resolving a different tree.
  CI: true

# Least privilege by default. No job here writes to the repo; the release workflow
# requests what it needs at its own level rather than inheriting a broad default.
permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # `lint` runs eslint and then the boundaries checker, which enforces
      # ADR-0003/0004/0005/0007/0009. Both are blocking gates per TIP §49.
      - name: Lint and package boundaries
        run: pnpm run lint

      # apps/web's typecheck runs `next typegen` first: the RouteContext<'/route'>
      # type every API route handler uses is generated into .next/types, which does
      # not exist on a fresh checkout. This passed locally only because a stale .next
      # was lying around, and failed here every time.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit and golden tests
        run: pnpm run test

      # Increment 2 of the web UI plan landed apps/web/test/integration/** —
      # real Route Handlers against real @mcpgen/* packages and a real temp
      # disk store, zero mocks. --passWithNoTests stays as a safety net.
      - name: Integration tests
        run: pnpm exec vitest run --project integration --passWithNoTests

  security:
    name: security suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The security suite imports @mcpgen/* packages by their published entry points,
      # so it needs dist/ to exist. Without this the whole project failed to collect
      # with "Failed to resolve entry for package @mcpgen/openapi-adapter".
      - name: Build
        run: pnpm run build

      # P1-W18-T01 landed the safe-fetch security suite in openapi-adapter
      # (ip-blocklist, safe-fetch, resolve-remote-refs). `--passWithNoTests`
      # stays as a safety net, not because the suite is empty anymore.
      - name: Security and secret-leakage tests
        run: pnpm exec vitest run --project security --passWithNoTests

      # ADR-0006. See tooling/scripts/scan-secrets.mjs for why this is a script and
      # not the previous inline grep: that grep matched every test sentinel, so it
      # could never have passed had it ever actually run.
      - name: Scan for secret literals
        run: node tooling/scripts/scan-secrets.mjs

  e2e:
    name: protocol E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm run build

      # Drives a real MCP client against the spawned server. Includes the
      # ADR-0009 era assertion: server/discover must report 2026-07-28.
      - name: stdio + HTTP protocol E2E
        run: pnpm exec vitest run --project e2e --passWithNoTests

  web-e2e:
    name: web wizard E2E + accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The Playwright specs import @mcpgen/test-fixtures to seed a project, and the
      # dev server the config boots resolves the other @mcpgen/* packages from dist/.
      - name: Build
        run: pnpm run build

      - run: pnpm --filter @mcpgen/web exec playwright install --with-deps chromium

      # Real browser, real Next.js dev server (see apps/web/playwright.config.ts). Covers
      # the full wizard happy path, axe (zero serious/critical) across all 10 routes, and
      # keyboard-only traversal of the two custom widgets (TIP §93 C26–C30, Increment 12).
      - name: Playwright (wizard, accessibility, keyboard)
        run: pnpm --filter @mcpgen/web exec playwright test
