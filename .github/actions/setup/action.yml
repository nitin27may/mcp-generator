name: Setup
description: >
  Checkout-adjacent toolchain setup shared by every CI job: pnpm/action-setup (which resolves the
  pnpm version pinned in the root package.json's packageManager field), Node from .nvmrc,
  and a frozen-lockfile install. Factored out because four jobs had drifted copies of it.

runs:
  using: composite
  steps:
    # Reads the pnpm version from the root package.json's packageManager field.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
